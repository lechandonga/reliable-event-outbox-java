server.port=8080
spring.datasource.url=jdbc:h2:file:./data/reliable-outbox;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

outbox.relay.fixed-delay-ms=200
outbox.relay.batch-size=100
outbox.relay.max-attempts=5
outbox.relay.backoff-initial-ms=200
outbox.relay.backoff-multiplier=2
outbox.relay.backoff-max-ms=5000
outbox.relay.worker-threads=4
outbox.relay.in-progress-timeout-ms=5000
spring.sql.init.mode=always
