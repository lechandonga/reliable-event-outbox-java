server.port=0
spring.datasource.url=jdbc:h2:file:./target/reliable-outbox-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

outbox.relay.fixed-delay-ms=600000
outbox.relay.batch-size=100
outbox.relay.max-attempts=3
outbox.relay.backoff-initial-ms=10
outbox.relay.backoff-multiplier=1
outbox.relay.backoff-max-ms=10
outbox.relay.worker-threads=4
outbox.relay.in-progress-timeout-ms=300000
spring.sql.init.mode=always
